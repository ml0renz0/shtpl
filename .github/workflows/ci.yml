name: CI

# Run CI only for pull requests, or when explicitly requested.
on:
  pull_request:
  workflow_dispatch:

# New commits on a PR supersede outdated runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis and legacy report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Bash quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
      - name: Bash syntax
        run: |
          bash -n shtpl
          for file in tests/*.sh scripts/*.sh; do
            bash -n "$file"
          done
      - name: ShellCheck new test scripts
        run: shellcheck -s bash tests/*.sh scripts/*.sh
      - name: shfmt new test scripts
        run: |
          files="$(shfmt -ln bash -i 2 -l tests/*.sh scripts/*.sh)"
          if [[ -n "$files" ]]; then
            printf 'Files need formatting:\n%s\n' "$files"
            shfmt -ln bash -i 2 -d tests/*.sh scripts/*.sh
            exit 1
          fi
      - name: Snapshot legacy lint debt (non-blocking)
        run: |
          shellcheck -s bash -f gcc shtpl > legacy-shellcheck.txt 2>&1 || true
          shfmt -ln bash -i 2 -d shtpl > legacy-shfmt.diff 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-lint-debt
          path: |
            legacy-shellcheck.txt
            legacy-shfmt.diff
          retention-days: 14

  bats:
    name: Bats on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Print Bash version
        run: bash --version | head -n 1
      - name: Run baseline and documented pending contracts
        run: bats tests/baseline.bats tests/known-issues.bats tests/compiler.bats
      - name: Cross-check golden fixtures byte-for-byte
        run: |
          bash tests/smoke.sh
          bash tests/compile-smoke.sh
          bash tests/nesting-smoke.sh
          bash tests/expressions-smoke.sh
          bash tests/diagnostics-smoke.sh
          bash tests/security-smoke.sh
          bash tests/cli-smoke.sh
          bash tests/release-smoke.sh
          bash tests/versioning-smoke.sh
          bash tests/advanced-smoke.sh

  bash-4:
    name: Legacy Bash 4.4 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute golden fixtures with Bash 4.4
        run: |
          docker run --rm \
            --mount type=bind,source="${{ github.workspace }}",target=/project,readonly \
            --workdir /project \
            bash:4.4 \
            sh -c "apk add --no-cache coreutils >/dev/null && bash tests/smoke.sh && bash tests/compile-smoke.sh && bash tests/nesting-smoke.sh && bash tests/expressions-smoke.sh && bash tests/diagnostics-smoke.sh && bash tests/security-smoke.sh && bash tests/cli-smoke.sh && bash tests/advanced-smoke.sh"

  performance:
    name: Informative performance benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU time
        run: sudo apt-get update && sudo apt-get install -y time
      - name: Measure compile and render performance
        run: |
          bash tests/benchmark.sh > benchmark.csv
          cat benchmark.csv
          {
            echo '## shtpl F08 performance (informative)'
            echo
            echo 'Measurements include runner noise; no fixed pass/fail thresholds.'
            echo
            echo '\`\`\`csv'
            cat benchmark.csv
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: benchmark.csv
          retention-days: 14
